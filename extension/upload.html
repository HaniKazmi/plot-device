<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Upload Image</title>
    <style>
      :root {
        color-scheme: light dark;
        --ground: #ffffff;
        --ink: #1d2126;
        --muted: #5f6670;
        --line: #d9dde2;
        --accent: #7553ff;
        --on-accent: #ffffff;
        --danger: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #1d2126;
          --ink: #eef0f2;
          --muted: #a3aab3;
          --line: #3a4048;
          --accent: #a38cff;
          --on-accent: #1d2126;
          --danger: #ff8a80;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--ground);
        color: var(--ink);
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 16px;
        font-weight: 600;
      }
      .picture {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 240px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .picture img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .picture.dropping {
        border-color: var(--accent);
        outline: 2px dashed var(--accent);
        outline-offset: -6px;
      }
      .picture canvas {
        touch-action: none;
        cursor: move;
      }
      #adjust {
        margin: -8px 0 16px;
      }
      .control-row {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 36px;
      }
      .row-label {
        width: 36px;
        flex: none;
        font-weight: 600;
      }
      .controls {
        display: flex;
        flex: 1;
        gap: 8px;
        align-items: center;
      }
      .controls input[type="range"] {
        flex: 1;
        min-width: 0;
        accent-color: var(--accent);
      }
      .snaps {
        display: flex;
        gap: 2px;
      }
      .snaps button {
        width: 32px;
        padding: 0;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .facts {
        margin: 6px 0 16px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .existing {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 48px;
        margin-top: 8px;
      }
      .existing img {
        height: 48px;
        border-radius: 4px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        height: 32px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .result {
        word-break: break-all;
        user-select: all;
      }
      .error {
        color: var(--danger);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Upload Image</h1>
    <div class="picture">
      <span
        id="picture"
        class="muted"
        >Fetching…</span
      >
      <canvas
        id="canvas"
        hidden
      ></canvas>
    </div>
    <div
      id="facts"
      class="muted facts"
    ></div>

    <div
      id="adjust"
      hidden
    >
      <div class="control-row">
        <span class="row-label">Crop</span>
        <div class="controls">
          <input
            type="range"
            data-control="zoom"
            min="100"
            max="400"
            value="100"
            aria-label="Zoom"
          />
          <button
            type="button"
            data-control="crop-reset"
          >
            Reset
          </button>
        </div>
      </div>
      <div class="control-row">
        <span class="row-label">Logo</span>
        <span
          data-control="logo-hint"
          class="muted"
          >Paste (⌘V) or drop one onto the picture</span
        >
        <div
          data-control="logo-controls"
          class="controls"
          hidden
        >
          <input
            type="range"
            data-control="logo-size"
            min="5"
            max="90"
            value="40"
            aria-label="Logo size"
          />
          <div class="snaps">
            <button
              type="button"
              data-snap="top-left"
              aria-label="Top left"
            >
              ↖
            </button>
            <button
              type="button"
              data-snap="top-right"
              aria-label="Top right"
            >
              ↗
            </button>
            <button
              type="button"
              data-snap="centre"
              aria-label="Centre"
            >
              ●
            </button>
            <button
              type="button"
              data-snap="bottom-left"
              aria-label="Bottom left"
            >
              ↙
            </button>
            <button
              type="button"
              data-snap="bottom-right"
              aria-label="Bottom right"
            >
              ↘
            </button>
          </div>
          <button
            type="button"
            data-control="logo-remove"
          >
            Remove
          </button>
        </div>
      </div>
    </div>

    <form id="form">
      <label for="name">Name</label>
      <input
        id="name"
        autocomplete="off"
        spellcheck="false"
        placeholder="The title as the sheet writes it"
        required
      />
      <div class="existing">
        <img
          id="existing-picture"
          alt=""
          hidden
        />
        <span
          id="existing"
          class="muted"
        ></span>
      </div>
      <div class="actions">
        <button
          type="button"
          id="cancel"
        >
          Cancel
        </button>
        <button
          type="submit"
          id="upload"
          class="primary"
          disabled
        >
          Upload
        </button>
      </div>
    </form>

    <div
      id="done"
      hidden
    >
      <label>Artwork cell</label>
      <div
        id="result"
        class="result"
      ></div>
      <div
        id="copied"
        class="muted"
      ></div>
      <div class="actions">
        <button
          type="button"
          id="close"
          class="primary"
        >
          Done
        </button>
      </div>
    </div>

    <p
      id="error"
      class="error"
      hidden
    ></p>

    <script
      type="module"
      src="upload.js"
    ></script>
  </body>
</html>
