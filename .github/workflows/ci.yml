name: CI

on:
  push:
  pull_request:

# A new push to the same branch supersedes whatever is already running on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 needs ^20.19.0 || >=22.12.0.
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc and eslint are expected to print nothing at all; any output is a failure.
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
