name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each step is expected to produce no output of its own; anything printed is a failure.
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
