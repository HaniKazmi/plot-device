name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a branch supersedes whatever is still running on it — except on master,
  # where a cancelled run could interrupt a deploy midway through its push to gh-pages.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 needs ^20.19.0 || >=22.12.0.
          node-version: 24
          cache: npm

      - run: npm ci

      # tsc and eslint are expected to print nothing at all; any output is a failure.
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  sheets-function:
    # Its own package and its own Node: the function runs on Cloud Run's nodejs24 runtime, executing
    # its .ts files through type stripping, so the suite runs there under the same Node.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/sheets
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/sheets/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    # Only ever runs off the back of a green verify, in the same run that produced it. The sheets
    # function deploys by hand (functions/sheets/deploy.sh), so its job gates nothing here.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # gh-pages pushes the built site to the gh-pages branch, which is what Pages serves.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Identify the committer
        # Read out of this checkout by gh-pages itself and written into its clone, so local
        # config is enough here — unlike the credential below.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # gh-pages does not push from this checkout. It clones the repo into node_modules/.cache
      # and pushes from there, and that fresh clone has none of the credentials actions/checkout
      # wrote into this one's local config, so the push falls through to asking for a username on
      # a machine with no terminal. Only a global rewrite reaches the clone.
      - name: Authorise the push to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Vite inlines import.meta.env at build time, so these have to be present for the build
      # that produces the deployed bundle — not at runtime. A local deploy picks them up from
      # .env.local, which is gitignored and so absent here; without them the bundle ships a
      # literal undefined: Google Identity Services rejects a missing client id with "Missing
      # required parameter client_id", and a missing function URL sends every read to
      # `undefined/values`, each on a site that otherwise looks fine.
      #
      # Checked before the build rather than after, because a missing value fails at the point
      # a visitor clicks Authorise, not at the point it is baked in.
      - name: Check the build has its sign-in and sheets settings
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SHEETS_URL: ${{ secrets.VITE_SHEETS_URL }}
        run: |
          : "${VITE_GOOGLE_CLIENT_ID:?missing repository secret VITE_GOOGLE_CLIENT_ID}"
          : "${VITE_SHEETS_URL:?missing repository secret VITE_SHEETS_URL}"

      # Runs the same script as a local deploy, so the two cannot drift. Its predeploy hook
      # rebuilds, because jobs do not share a filesystem with verify.
      - run: npm run deploy
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SHEETS_URL: ${{ secrets.VITE_SHEETS_URL }}
